# Supabase pausa los proyectos gratis tras ~1 semana sin uso.
# Esta tarea hace una consulta pequeña cada 3 días para mantenerlo activo.
# (La URL y la clave son las públicas de cloud-config.js; no son secretas.)
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a Supabase
        run: |
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://ragsrhvaepisvigthmyu.supabase.co/rest/v1/pivi_state?select=profile_id&limit=1" \
            -H "apikey: sb_publishable_IT3VI3E0VdJvOayOBm7m4Q_bqaL7Vuf"
