<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icono de Pivi: la ruleta de la app, plana, sobre azul noche.
       Fondo a sangre: sirve como icono normal y "maskable" (Android lo
       recorta en círculo; todo el dibujo cae dentro de la zona segura). -->
  <rect width="512" height="512" fill="#1f2544"/>
  <!-- sectores: 6 de 60° en coral / mostaza / turquesa (empiezan arriba) -->
  <g transform="rotate(-90 256 276)">
    <circle cx="256" cy="276" r="75" fill="none" stroke="#ff7a6b" stroke-width="150"/>
    <circle cx="256" cy="276" r="75" fill="none" stroke="#ffc857" stroke-width="150" stroke-dasharray="78.54 157.08"/>
    <circle cx="256" cy="276" r="75" fill="none" stroke="#4ecdc4" stroke-width="150" stroke-dasharray="78.54 157.08" stroke-dashoffset="-78.54"/>
  </g>
  <!-- aro, eje y flecha -->
  <circle cx="256" cy="276" r="150" fill="none" stroke="#fff4e8" stroke-width="12"/>
  <circle cx="256" cy="276" r="26" fill="#1f2544" stroke="#fff4e8" stroke-width="8"/>
  <polygon points="232,92 280,92 256,138" fill="#fff4e8"/>
</svg>
