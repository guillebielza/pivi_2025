<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9aab"/>
      <stop offset=".55" stop-color="#ff6b81"/>
      <stop offset="1" stop-color="#f0506a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".2" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf6"/>
      <stop offset="1" stop-color="#ffe7dd"/>
    </linearGradient>
  </defs>
  <!-- fondo a sangre: sirve como icono normal y "maskable" (Android lo recorta en círculo) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g transform="translate(256 265) scale(1.1) translate(-256 -265)">
